<mat-sidenav-container>
  <mat-sidenav position="end" opened mode="side"><app-custom-sidenav /></mat-sidenav>

  <mat-drawer-content style="margin-right: 0px">
    <app-toolbar></app-toolbar>

    <body>
      <div class="contenedor">
        <!-- Panel Izquierdo -->
        <div class="panel-izquierdo">
          <img src="perfil.jpeg" alt="Foto perfil" i18n-alt="@@profile.photoAlt" class="foto-perfil" />
          <h2>Enrique Ruiz</h2>
          <p i18n="@@profile.role">Desarrollador de Software</p>
          <div class="iconos-sociales">
            <a href="https://api.whatsapp.com/send?phone=34657825611" target="_blank"
              ><img
                src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
                alt="WhatsApp"
                i18n-alt="@@social.whatsappAlt"
            /></a>
            <a href="https://www.linkedin.com/in/enriruiztirado/" target="_blank"
              ><img
                src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"
                alt="LinkedIn"
                i18n-alt="@@social.linkedinAlt"
            /></a>
            <a href="https://github.com/enri123" target="_blank"
              ><img
                src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg"
                alt="GitHub"
                i18n-alt="@@social.githubAlt"
            /></a>
          </div>
          <button class="btn-cv">
            <a
              href="https://drive.google.com/file/d/1hNKqI6rM1CABH8SPJVRBo_ZW4T8WY5mw/view?usp=sharing"
              download="nombre-del-archivo.pdf"
              target="_blank"
              i18n="@@profile.downloadResume">Descargar CV</a
            >
          </button>
        </div>

        <div class="panel-derecho">
          <router-outlet />
        </div>
      </div>
    </body>
  </mat-drawer-content>
</mat-sidenav-container>

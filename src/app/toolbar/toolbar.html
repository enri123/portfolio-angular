<mat-toolbar style="background-color: transparent; width: 100%">
  <button (click)="changeLanguage('es')" aria-label="Español" i18n-aria-label="@@language.spanish">
    <img src="espana.png" alt="Bandera de España" i18n-alt="@@language.spanishFlag" class="bandera" />
  </button>
  <button (click)="changeLanguage('en')" aria-label="Inglés" i18n-aria-label="@@language.english">
    <img src="reino-unido.png" alt="Bandera del Reino Unido" i18n-alt="@@language.englishFlag" class="bandera" />
  </button>

  <select
    class="selector-estilo"
    aria-label="Estilo de página"
    i18n-aria-label="@@style.selectorLabel"
    [value]="selectedStyle"
    (change)="changeStyle($event)"
  >
    <option value="1" i18n="@@style.option1">Estilo 1</option>
    <option value="2" i18n="@@style.option2">Estilo 2</option>
    <option value="3" i18n="@@style.option3">Estilo 3</option>
  </select>
</mat-toolbar>

<div class="contenido">
  <h2 i18n>Proyectos Personales</h2>
  <div class="checkboxes">
    <div class="parte">
      @for (item of items(); track item.label) {
        @if ($index < 6) {
          <input
            type="checkbox"
            id={{ item.id }}
            name={{ item.id }}
            value={{ item.id }}
            checked
            (click)="currentCheckbox(item.id)"
          />
          <label for={{ item.id }}>{{ item.label }}</label>
        }
      }
    </div>
    <div class="lenguajes">
      @for (item of items(); track item.label) {
        @if ($index >= 6) {
          <input
            type="checkbox"
            id={{ item.id }}
            name={{ item.id }}
            value={{ item.id }}
            checked
            (click)="currentCheckbox(item.id)"
          />
          <label for={{ item.id }}>{{ item.label }}</label>
        }
      }

    </div>
  </div>
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

    @for (proyecto of proyectos(); track proyecto.label){
      <div class="col text-center {{ proyecto.herramientas }}">
        <div class="project-card reveal">
          <a href="{{ proyecto.path }}" target="_blank">
            <img src="{{ proyecto.imagen }}" alt="{{ proyecto.label }}" class="img-fluid mt-2" loading="lazy" />
          </a>
        </div>
        <h5>{{ proyecto.label }}</h5>
      </div>
    }
  </div>
</div>

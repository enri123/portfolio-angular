<div class="contenido">
  <header class="cabecera-contacto">
    <p class="eyebrow" i18n="@@contact.eyebrow">Hablemos</p>
    <h2 class="titulo" i18n="@@contact.title">Contacto</h2>
    <p i18n="@@contact.intro">¿Tienes una propuesta, un proyecto o quieres conocer mejor mi trabajo? Puedes escribirme directamente.</p>
  </header>
  <div class="datos">
    <div class="botones">
      <a class="boton" href="https://maps.app.goo.gl/uEHv49gQw9gEmHMc6" target="_blank" rel="noopener noreferrer">
        <mat-icon class="icon" aria-hidden="true">place</mat-icon>
        <span><small i18n="@@contact.location">Ubicación</small><strong>España</strong></span>
      </a>

      <a class="boton" href="https://api.whatsapp.com/send?phone=34657825611" target="_blank" rel="noopener noreferrer">
        <mat-icon class="icon" aria-hidden="true">local_phone</mat-icon>
        <span><small i18n="@@contact.phone">Teléfono</small><strong>657 825 611</strong></span>
      </a>

      <a class="boton" href="mailto:enriruiztirado11@gmail.com">
        <mat-icon class="icon" aria-hidden="true">mail</mat-icon>
        <span><small i18n="@@contact.email">Email</small><strong>enriruiztirado11@gmail.com</strong></span>
      </a>
    </div>
    <div class="formulario">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6636812.453867673!2d-12.253938425735845!3d35.68608487702633!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc42e3783261bc8b%3A0xa6ec2c940768a3ec!2zRXNwYcOxYQ!5e0!3m2!1ses!2ses!4v1788849705287!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">"
        width="100%"
        height="200px"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

      <form (ngSubmit)="sendEmail()" #contactForm="ngForm">
        <label>
          <span i18n="@@contact.nameLabel">Nombre:</span>
          <input
            type="text"
            name="from_name"
            [(ngModel)]="model.from"
            required
            placeholder="Nombre"
            i18n-placeholder="@@contact.namePlaceholder"
          />
        </label>

        <label>
          <span i18n="@@contact.emailLabel">Correo:</span>
          <input
            type="email"
            name="reply_to"
            [(ngModel)]="model.reply_to"
            required
            placeholder="Correo"
            i18n-placeholder="@@contact.emailPlaceholder"
          />
        </label>

        <label>
          <span i18n="@@contact.subjectLabel">Asunto:</span>
          <input
            type="text"
            name="subject"
            [(ngModel)]="model.title"
            required
            placeholder="Asunto"
            i18n-placeholder="@@contact.subjectPlaceholder"
          />
        </label>

        <label>
          <span i18n="@@contact.messageLabel">Mensaje:</span>
          <textarea
            name="message"
            [(ngModel)]="model.message"
            required
            placeholder="Mensaje"
            i18n-placeholder="@@contact.messagePlaceholder"
          ></textarea>
        </label>

        <button class="boton_form" type="submit" [disabled]="sending">
          {{ submitLabel }}
        </button>

        @if (successMsg) {
          <p class="success">{{ successMsg }}</p>
        }
        @if (errorMsg) {
          <p class="error">{{ errorMsg }}</p>
        }
      </form>
    </div>
  </div>
</div>
